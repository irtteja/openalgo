<title>NSE Pattern Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a market ledger — sticky tab rail, summary first, every row opens into its full evidence. */
:root{
  --bg:#F3F6F5; --panel:#FFFFFF; --ink:#13211C; --muted:#5B6B65; --line:#D9E2DE; --soft:#E8EEEB;
  --accent:#0E7466; --accent-soft:#D5ECE7; --up:#1C7C3A; --up-soft:#DCEFE1; --down:#B3332B; --down-soft:#F6DEDB; --warn:#9A6A00; --warn-soft:#F5E9C8;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --panel:#141D1A; --ink:#E2ECE8; --muted:#93A59E; --line:#26332F; --soft:#1B2623;
  --accent:#43C1AC; --accent-soft:#16342E; --up:#5CCB7C; --up-soft:#173322; --down:#F07A70; --down-soft:#3A1C1A; --warn:#E2B24A; --warn-soft:#3A2F14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --panel:#141D1A; --ink:#E2ECE8; --muted:#93A59E; --line:#26332F; --soft:#1B2623;
  --accent:#43C1AC; --accent-soft:#16342E; --up:#5CCB7C; --up-soft:#173322; --down:#F07A70; --down-soft:#3A1C1A; --warn:#E2B24A; --warn-soft:#3A2F14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--panel);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:6px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,4vw,34px);letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:70ch}
.topbar{display:flex!important;flex-direction:row!important;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px 10px!important}
.topbar h1{font-size:clamp(20px,3vw,26px)}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:20;max-height:60vh;overflow:auto}
.results a{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--soft)}
.results a:hover{background:var(--soft)}
nav.tabs .sub2{border-top:1px solid var(--soft)}
nav.tabs .sub2 a{padding:8px 12px;font-size:14px;font-weight:500}
.chip{white-space:normal!important}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.g-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.g-item.good{border-color:var(--up);background:var(--up-soft)}
.g-item.bad{border-color:var(--down);background:var(--down-soft)}
.g-v{font-weight:600;font-size:16px;margin-top:2px}
.jump{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);z-index:4;display:flex;gap:6px;overflow-x:auto;padding:6px 0;background:var(--bg);scrollbar-width:none}
.jump button{flex:none;padding:6px 10px;font-size:13px;border-radius:999px}
.summary p{margin:6px 0;max-width:90ch}
.chhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.chbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.chlegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:12.5px;min-height:22px;padding:4px 0;font-variant-numeric:tabular-nums}
.minigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;touch-action:pan-y}
.minicard{display:flex;flex-direction:column;gap:2px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);text-decoration:none;color:var(--ink);min-width:0}
.minicard:hover{border-color:var(--accent)} .minicard.sel{border-color:var(--accent);background:var(--accent-soft)}
.mhead{display:flex;justify-content:space-between;gap:6px;font-size:13px}.mval{font-family:var(--mono);font-size:12.5px}
#chIdx,#rscIdx,#rscInd,#rtIdx{max-width:min(100%,320px)}
.fcard.sel{outline:2px solid var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pcard{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font:inherit;color:var(--ink)}
.pcard:hover{border-color:var(--accent)} .pcard.sel{border-color:var(--accent);background:var(--accent-soft)} .pcard.warnc b:first-child{color:var(--down)}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}.pstats span{display:flex;flex-direction:column}.pstats b{font-family:var(--mono);font-size:15px}.pstats small{font-size:11px;color:var(--muted)}
.rtsel{display:block;width:100%;margin-top:6px}
#rtA,#rtB{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.fgrid .tog{display:flex;margin:3px 0}.fgrid input[type=number],.fgrid select,.fgrid input[type=search]{width:100%;font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}.fgrid input[type=range]{width:100%}
button.minicard{font:inherit;text-align:left;cursor:pointer;color:var(--ink)}
main{overflow-x:clip}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{flex:none;padding:12px 14px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:3px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:18px 60px;display:flex;flex-direction:column;gap:22px}
h2{font-family:var(--display);font-weight:700;font-size:21px;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:16px;margin:0}
.lede{color:var(--muted);margin:0;max-width:75ch}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.v{font-family:var(--mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.chip.up{background:var(--up-soft);border-color:transparent;color:var(--up)}
.chip.down{background:var(--down-soft);border-color:transparent;color:var(--down)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px}
.ph-Leading{background:var(--up-soft);color:var(--up)} .ph-Weakening{background:var(--warn-soft);color:var(--warn)}
.ph-Lagging{background:var(--down-soft);color:var(--down)} .ph-Improving{background:var(--accent-soft);color:var(--accent)}
.tablebox{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--soft)}
th{position:sticky;top:0;background:var(--panel);font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
td.t{font-family:var(--body);text-align:left;white-space:normal;min-width:240px}
tbody tr{cursor:pointer} tbody tr:hover td{background:var(--soft)}
.pos{color:var(--up)} .neg{color:var(--down)}
.heat{border-radius:5px;padding:1px 6px;display:inline-block;min-width:3.2em}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=search],select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-width:0}
input[type=search]{flex:1 1 220px}
label.tog{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.list{display:flex;flex-direction:column}
.list .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--soft);cursor:pointer}
.list .row:last-child{border-bottom:0}
.list .row span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.probgrid{display:grid;grid-template-columns:auto repeat(4,1fr);gap:4px;font-size:13px}
.probgrid div{padding:6px 8px;border-radius:6px;text-align:center;font-family:var(--mono)}
.probgrid .h{font-family:var(--body);color:var(--muted);font-size:12px;background:none;text-align:left}
.probgrid .c small{display:block;font-size:11px;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);padding:0;width:min(920px,calc(100vw - 24px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(5,12,10,.55)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:16px}
.dlg header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pat{padding:9px 0;border-bottom:1px solid var(--soft);display:flex;flex-direction:column;gap:3px}
.pat:last-child{border-bottom:0}
.pat .then{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--soft);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px}
svg text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.md table{font-size:12.5px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.rg{display:grid;grid-template-columns:90px 1fr;gap:4px 12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--soft)}
.rg .note{grid-column:2}
.rgbar{position:relative;height:22px;background:var(--soft);border-radius:6px}
.rgbar i{position:absolute;display:block}
#view a{color:var(--accent)}
#view svg a{color:inherit}
.heatgrid td{font-size:12.5px;padding:6px 8px}
details summary{cursor:pointer;color:var(--accent)}
@media (max-width:560px){.probgrid{font-size:12px}.probgrid div{padding:5px 4px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<header class="top"><div class="wrap topbar">
  <div style="min-width:0"><h1>NSE Pattern Atlas</h1><p class="sub" id="stamp">Loading data…</p></div>
  <div class="search"><input type="search" id="gsearch" placeholder="Search a stock or index…" aria-label="Search a stock or index" autocomplete="off"><div id="gresults" class="results" hidden></div></div>
</div></header>
<nav class="tabs" aria-label="Sections"><div class="wrap" id="nav1"></div><div class="wrap sub2" id="nav2"></div></nav>
<main><div class="wrap" id="view"><div class="empty">Loading…</div></div></main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>
const H=["1w","1m","3m","6m"], HN={"1w":"1 week","1m":"1 month","3m":"3 months","6m":"6 months"};
const O=["up","beat","big_up","big_down"], ON={up:"Rises",beat:"Beats market",big_up:"Big gain vs mkt",big_down:"Big fall vs mkt"};
const BIG={"1w":5,"1m":10,"3m":20,"6m":30};
let D={}, state={cat:"",sortS:"3m|beat",dirS:-1,sortG:"3m|beat",dirG:-1,q:"",liq:true,ind:"",shown:150,pu:"stocks",ph:"",po:"",pd:"",pq:""};
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=(x,d=0)=>x==null||isNaN(x)?"–":(x*100).toFixed(d)+"%";
const sgn=(x,d=1)=>x==null||isNaN(x)?"–":(x>0?"+":"")+(x*100).toFixed(d)+"%";
const sgnP=(x,d=1)=>x==null||isNaN(x)?"–":(x>0?"+":"")+Number(x).toFixed(d)+"%";
const cls=x=>x>0?"pos":x<0?"neg":"";
function heat(p,base,bad){ if(p==null) return "–"; const d=(p-base)/Math.max(base,0.02); let a=Math.min(Math.abs(d),1);
  const good=bad?d<0:d>0; const col=good?"var(--up-soft)":"var(--down-soft)"; const fg=Math.abs(d)<0.08?"":(good?"color:var(--up)":"color:var(--down)");
  return `<span class="heat" style="background:${Math.abs(d)<0.08?"transparent":col};${fg}" title="normal ${pct(base)}">${pct(p)}</span>`;}
function spark(arr,w=110,h=28,ref=1){ const v=(arr||[]).filter(x=>x!=null); if(v.length<2) return "";
  const mn=Math.min(...v,ref),mx=Math.max(...v,ref),sx=w/(arr.length-1),sy=y=>h-2-(y-mn)/(mx-mn||1)*(h-4);
  let d=""; arr.forEach((y,i)=>{ if(y!=null) d+=(d?"L":"M")+(i*sx).toFixed(1)+","+sy(y).toFixed(1)});
  const up=v[v.length-1]>=v[0]; return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><line x1="0" x2="${w}" y1="${sy(ref)}" y2="${sy(ref)}" stroke="var(--line)" stroke-dasharray="2 3"/><path d="${d}" fill="none" stroke="${up?"var(--up)":"var(--down)"}" stroke-width="1.6"/></svg>`;}
function lineChart(xs,series,{h=180,fmt=x=>x}={}){ // series: [{v,color,label,axis}]
  const W=640,P={l:44,r:40,t:12,b:22}, iw=W-P.l-P.r, ih=h-P.t-P.b; let out=`<svg viewBox="0 0 ${W} ${h}" width="100%" role="img">`;
  series.forEach((s,si)=>{ const v=s.v.filter(x=>x!=null); const mn=Math.min(...v),mx=Math.max(...v); const sy=y=>P.t+ih-(y-mn)/(mx-mn||1)*ih;
    if(si===0){ for(let k=0;k<=3;k++){const y=mn+(mx-mn)*k/3; out+=`<line x1="${P.l}" x2="${W-P.r}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--soft)"/><text x="${P.l-6}" y="${sy(y)+3}" text-anchor="end">${s.fmt?s.fmt(y):Math.round(y)}</text>`;}}
    else { [mn,mx].forEach(y=>out+=`<text x="${W-P.r+6}" y="${sy(y)+3}">${s.fmt?s.fmt(y):y}</text>`);}
    let d=""; s.v.forEach((y,i)=>{ if(y!=null) d+=(d?"L":"M")+(P.l+i*iw/(s.v.length-1)).toFixed(1)+","+sy(y).toFixed(1)});
    out+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${si?1.3:2}" ${si?'stroke-dasharray="4 3"':''}/>`;
    const lx=P.l+iw, ly=sy(s.v[s.v.length-1]); out+=`<circle cx="${lx}" cy="${ly}" r="3" fill="${s.color}"/>`; });
  [0,Math.floor(xs.length/2),xs.length-1].forEach(i=>out+=`<text x="${P.l+i*iw/(xs.length-1)}" y="${h-6}" text-anchor="middle">${xs[i]}</text>`);
  return out+"</svg>";}
function probGrid(pr,normal){ let g=`<div class="probgrid"><div class="h"></div>${O.map(o=>`<div class="h">${ON[o]}</div>`).join("")}`;
  H.forEach(h=>{ g+=`<div class="h">${HN[h]}</div>`; O.forEach(o=>{ const k=h+"|"+o, p=pr[k], b=normal[k]; const d=(p-b)/Math.max(b,0.02), bad=o==="big_down";
    const good=bad?d<0:d>0, strong=Math.abs(d)>=0.08; g+=`<div class="c" style="background:${strong?(good?"var(--up-soft)":"var(--down-soft)"):"var(--soft)"}">${pct(p)}<small>normal ${pct(b)}</small></div>`;});});
  return g+"</div>";}
function patLine(s,univ){ univ=univ||state.pu; const lift=s.p-s.base, bad=s.o==="big_down"; const good=bad?lift<0:lift>0;
  const w=Math.min(100,s.p*100), wb=Math.min(100,s.base*100);
  return `<div class="pat" data-p="p-${univ==="groups"?"g":"s"}-${s.id}" style="cursor:pointer"><div>${s.conds.map(esc).join(" <b>+</b> ")}</div>
   <div class="then">→ <b class="${good?"pos":"neg"}">${ON[s.o].toLowerCase()} over ${HN[s.h]}: ${pct(s.p)}</b> vs normal ${pct(s.base)} · ${s.n.toLocaleString()} past cases · held in ${Math.round(s.agree*s.years)} of ${s.years} years</div>
   <div class="bar" title="chance vs normal"><i style="width:${w}%;background:${good?"var(--up)":"var(--down)"};opacity:.75"></i><i style="width:${wb}%;background:var(--ink);opacity:.18"></i></div></div>`;}
function sortedMatches(ids,univ,limit=40){ const P=D.patterns[univ]; return ids.map(i=>P[i]).filter(Boolean).sort((a,b)=>Math.abs(b.p-b.base)/Math.max(b.base,.02)-Math.abs(a.p-a.base)/Math.max(a.base,.02)).slice(0,limit);}

/* ---------------- views ---------------- */
async function viewToday(){ const m=D.market, N=m.normal.stocks, NG=m.normal.groups; const mp=state.mper||"d1"; const MM=await marketMap(mp);
  const liq=D.stocks.filter(s=>s.tvCr>=5);
  const top=(arr,k,n=10,dir=-1)=>[...arr].sort((a,b)=>dir*((a.pr[k]??0)-(b.pr[k]??0))).slice(0,n);
  const li=(arr,k,key)=>arr.map(s=>`<div class="row" data-${key}="${esc(s.s||s.g)}"><span>${esc(s.s||s.g.replace(/^index: /,"").replace(/^industry: /,"Industry · "))}</span><span>${pct(s.pr[k])}</span></div>`).join("");
  const reg=m.regime.map(r=>`<span class="chip">${esc(r.replace(/^market: |^calendar: /,""))}</span>`).join("");
  const OM=await oneMinute(); const Wb=(await load("watch.json")).breadth.now;
  return `${OM}<section class="grid">
   <div class="card"><div class="k">Nifty 500</div><div class="v">${Math.round(m.n500).toLocaleString()}</div><div class="note"><span class="${cls(m.n500_1m)}">${sgn(m.n500_1m)}</span> 1m · <span class="${cls(m.n500_3m)}">${sgn(m.n500_3m)}</span> 3m · <span class="${cls(m.n500_1y)}">${sgn(m.n500_1y)}</span> 1y · ${sgn(m.n500_fromHigh)} from high</div></div>
   <div class="card"><div class="k">India VIX (fear)</div><div class="v">${m.vix.toFixed(1)}</div><div class="note">Higher than ${pct(m.vixPct)} of days since 2015</div></div>
   <div class="card"><div class="k">Stocks above 200-day avg</div><div class="v">${pct(Wb.above200.value)}</div><div class="note">${pct(Wb.above50.value)} above 50-day avg · ${pct(m.adv10)} rose on an average day (last 10)</div></div>
   <div class="card"><div class="k">Stocks in NSE indices</div><div class="v">${m.listed.toLocaleString()}</div><div class="note">${liq.length.toLocaleString()} trade over ₹5 crore a day. Patterns were learned from all ${(m.allListed||0).toLocaleString()} listed stocks.</div></div>
  </section>
  <section class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><h3>Market map</h3>${perButtons(mp,"data-mper")}</div>
   <p class="note">All ${MM.n} index stocks, grouped by industry. Tile size = market cap. Colour = return over the chosen period. Tap a tile for the stock.</p>
   <div style="overflow-x:auto"><div style="min-width:640px">${MM.svg}</div></div>${heatLegend(mp)}</section>
  <section class="card"><h3>Market conditions the system sees today</h3><p class="note">Patterns that include these conditions are active now.</p><div class="chips">${reg||"<span class='note'>none</span>"}</div></section>

const RC={"Strong uptrend":"#1a7f37","Steady / mixed":"#7d8590","Weak market (correction or early recovery)":"#d4a72c","Stress / panic":"#cf222e"};
const sp=x=>x==null?"–":(x>0?"+":"")+(x*100).toFixed(1)+"%";
async function viewRegime(){ const S=await load("structure.json"), R=S.regime, H=R.history;
  const W=640,h=170,P={l:44,r:10,t:10,b:34},iw=W-P.l-P.r,ih=h-P.t-P.b, n=H.d.length, v=H.n500.filter(x=>x!=null), mn=Math.min(...v), mx=Math.max(...v);
  const x=i=>P.l+i*iw/(n-1), y=q=>P.t+ih-(Math.log(q)-Math.log(mn))/(Math.log(mx)-Math.log(mn)||1)*ih;
  let svg=`<svg viewBox="0 0 ${W} ${h}" width="100%" role="img">`;
  H.s.forEach((st,i)=>{ if(i<n-1) svg+=`<rect x="${x(i)}" y="${h-P.b+4}" width="${x(i+1)-x(i)+0.5}" height="10" fill="${RC[st]}"><title>${H.d[i]}: ${esc(st)}</title></rect>`;});
  let d=""; H.n500.forEach((q,i)=>{ if(q!=null) d+=(d?"L":"M")+x(i).toFixed(1)+","+y(q).toFixed(1);});
  svg+=`<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`;
  [0,Math.floor(n/2),n-1].forEach(i=>svg+=`<text x="${x(i)}" y="${h-4}" text-anchor="middle">${H.d[i].slice(0,7)}</text>`);
  [mn,mx].forEach(q=>svg+=`<text x="${P.l-6}" y="${y(q)+3}" text-anchor="end">${Math.round(q*1000)/1000}</text>`);
  svg+="</svg>";
  const F=[["trend_1m","Nifty 500, last month",sp],["trend_3m","Nifty 500, last 3 months",sp],["vol_1m","Swings (yearly volatility)",x=>pct(x)],["above50","Stocks above 50-day avg",x=>pct(x)],["above200","Stocks above 200-day avg",x=>pct(x)],["hi_minus_lo","New highs minus new lows",x=>pct(x,1)],["vix","India VIX",x=>x==null?"–":x.toFixed(1)]];
  const st=R.states.slice().sort((a,b)=>Object.keys(RC).indexOf(a.name)-Object.keys(RC).indexOf(b.name));
  return `<div><h2>Market regime</h2><p class="lede">What state is the market in? A learning model (Gaussian mixture) grouped every week since 2016 by trend, swings, breadth, new highs/lows and VIX into four states. Nobody labelled the weeks; the model found the groups, and they are named from their averages.</p></div>
  <div class="card" style="border-left:6px solid ${RC[R.now]}"><div class="note">This week</div><h2 style="margin:4px 0">${esc(R.now)}</h2><p style="margin:0">${esc(st.find(z=>z.name===R.now).desc)} In this state for ${R.weeks_in_state} week${R.weeks_in_state>1?"s":""}. Model confidence: ${Object.entries(R.probabilities).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${esc(k)} ${pct(v)}`).join(" · ")}.</p></div>
  <h3>Why: this week vs the average of each state</h3><div class="tablebox"><table><thead><tr><th></th><th>This week</th>${st.map(z=>`<th style="color:${RC[z.name]}">${esc(z.name)}</th>`).join("")}</tr></thead><tbody>
  ${F.map(([k,l,f])=>`<tr><td>${l}</td><td><b>${f(R.today[k])}</b></td>${st.map(z=>`<td>${f(z.avg[k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
  <h3>Nifty 500 since 2016, coloured by state</h3><div class="card">${svg}<div class="chips">${Object.entries(RC).map(([k,c])=>`<span class="chip"><i style="display:inline-block;width:10px;height:10px;background:${c};margin-right:6px"></i>${esc(k)}</span>`).join("")}</div></div>
  <h3>What each state looked like, and what followed</h3><div class="tablebox"><table><thead><tr><th>State</th><th>Share of weeks</th><th>Typical stay</th><th>Nifty 500 next 4 weeks</th><th>Next 13 weeks</th><th>4 weeks later it was…</th></tr></thead><tbody>
  ${st.map(z=>`<tr><td style="color:${RC[z.name]};font-weight:600">${esc(z.name)}</td><td>${pct(z.share_of_weeks)}</td><td>${z.typical_weeks} wk</td><td>${sp(z.nifty500_next_4w.mean)} (up ${pct(z.nifty500_next_4w.pos)})</td><td>${sp(z.nifty500_next_13w.mean)} (up ${pct(z.nifty500_next_13w.pos)}, ${z.nifty500_next_13w.n} wk)</td><td class="note">${Object.entries(z.in_4w).filter(e=>e[1]>0.02).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${esc(k)} ${pct(v)}`).join(" · ")}</td></tr>`).join("")}</tbody></table></div>
  <p class="note">${esc(R.method)} Past weeks are few for the rarer states, so treat their numbers as rough.</p>`;}
async function viewHidden(){ const S=await load("structure.json"), F=S.forces, G=S.groups;
  const dir=v=>v==null?"–":v>0.3?"pushing up strongly":v>0.05?"pushing up":v<-0.3?"pushing down strongly":v<-0.05?"pushing down":"flat";

  return `<div><h2>Hidden groups and driving forces</h2><p class="lede">Found by learning models from the last year of daily moves, without NSE's labels. <b>Forces</b>: the few hidden themes that move many stocks at once. <b>Groups</b>: stocks that actually move together once the market's own swing is removed; some match an NSE industry, some cut across industries.</p></div>
  <h3>Driving forces</h3><div class="two">${F.items.map(f=>`<div class="card" style="display:flex;flex-direction:column;gap:6px"><div class="chips"><span class="chip">Force ${f.k}</span><span class="chip">explains ${pct(f.share,1)} of daily moves</span></div>
   <h3>${esc(f.name)}</h3>${f.k>1?`<p style="margin:0">One side: ${f.plus_industries.map(esc).join(", ")} (e.g. ${f.plus_stocks.slice(0,4).map(sLink).join(", ")}). Other side: ${f.minus_industries.map(esc).join(", ")} (e.g. ${f.minus_stocks.slice(0,4).map(sLink).join(", ")}).</p>`:`<p style="margin:0">The single biggest force: most stocks rise and fall together with the market.</p>`}
   <div class="note">${f.k>1?`Last month: ${side(f.move_1m)} · last 3 months: ${side(f.move_3m)}`:`Last month: ${dir(f.move_1m)} · last 3 months: ${dir(f.move_3m)}`}</div>${spark(f.path,220,34,0)}</div>`).join("")}</div>
  <p class="note">${esc(F.method)}</p>
  <h3>${G.items.length} hidden groups, strongest first (vs Nifty 500)</h3><div class="tablebox"><table><thead><tr><th>Group</th><th>Stocks</th><th>Move together</th><th>Last month</th><th>3 months</th><th>Above 50-day</th><th>State</th><th>Path (1 year)</th><th>Main members</th></tr></thead><tbody>
  ${G.items.map(g=>`<tr><td><b>${esc(g.name)}</b><div class="note">${g.industries.map(([k,v])=>`${esc(k)} ${v}`).join(" · ")}</div></td><td>${g.n}</td><td>${num(g.togetherness,2)}</td><td class="${g.vs_n500_1m>0?"pos":"neg"}">${sp(g.vs_n500_1m)}</td><td class="${g.vs_n500_3m>0?"pos":"neg"}">${sp(g.vs_n500_3m)}</td><td>${pct(g.above50)}</td><td>${esc(g.state)}</td><td>${spark(g.path,110,28,0)}</td><td>${g.members.slice(0,8).map(sLink).join(", ")}${g.n>8?` <span class="note">+${g.n-8}</span>`:""}</td></tr>`).join("")}</tbody></table></div>
  <p class="note">${esc(G.method)}</p>`;}
async function viewBroad(){ const S=await load("structure.json"), B=S.breadth_of_moves; const ord=["Broad rise","Mixed rise","Narrow rise (few stocks)","Flat","Narrow fall (few stocks)","Mixed fall","Broad fall"];
  const rows=B.rows.slice().sort((a,b)=>ord.indexOf(a.verdict)-ord.indexOf(b.verdict)||(b.ret_m1-a.ret_m1));

  return `<div><h2>Is the move broad or narrow?</h2><p class="lede">A sector rising with most of its stocks is healthier than one lifted by two or three heavyweights. For each sector and theme index: how many members joined in, and whether its top 3 movers gave more of the move than their weight in the index.</p></div>
  <div class="chips">${ord.map(v=>`<span class="chip">${v}: ${B.rows.filter(r=>r.verdict===v).length}</span>`).join("")}</div>
  <div class="tablebox"><table><thead><tr><th>Index</th><th>Verdict (1 month)</th><th>Index 1m</th><th>Members up</th><th>Top 3 gave</th><th>Their weight</th><th>Top 3</th><th>Index 3m</th><th>Members up 3m</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${r.g?`<a href="#g-${D.groups.findIndex(g=>g.g===r.g)}">${esc(r.name)}</a>`:esc(r.name)}</td><td class="${col(r.verdict)}"><b>${esc(r.verdict)}</b></td><td>${sp(r.ret_m1)}</td><td>${pct(r.up_m1)}</td><td>${pct(r.top3_share_m1)}</td><td>${pct(r.top3_weight_m1)}</td><td>${(r.top3_m1||[]).map(sLink).join(", ")}</td><td>${sp(r.ret_m3)}</td><td>${pct(r.up_m3)}</td></tr>`).join("")}</tbody></table></div>

async function viewBreakdown(){ const S=await load("structure.json"), R=S.breakdown.rows;
  const seg=(v,c)=>v==null?"":`<i title="${sp(v)}" style="display:inline-block;height:10px;width:${Math.min(60,Math.abs(v)*200)}px;background:${c};opacity:${v<0?.45:.9}"></i>`;
  const row=r=>`<tr><td>${sLink(r.s)}<div class="note">${esc(r.ind||"")}</div></td><td><b>${sp(r.tot_3m)}</b></td><td>${sp(r.mkt_3m)}</td><td>${sp(r.ind_3m)}</td><td class="${r.own_3m>0?"pos":"neg"}"><b>${sp(r.own_3m)}</b></td><td>${seg(r.mkt_3m,"#7d8590")}${seg(r.ind_3m,"#0969da")}${seg(r.own_3m,r.own_3m>0?"var(--up)":"var(--down)")}</td><td>${sp(r.tot_1m)} = ${sp(r.mkt_1m)} ${sp(r.ind_1m)} ${sp(r.own_1m)}</td></tr>`;
  const own=R.slice().sort((a,b)=>b.own_3m-a.own_3m), q=(state.bq||"").toUpperCase();

  const head=`<thead><tr><th>Stock</th><th>3-month move</th><th>Market part</th><th>Industry part</th><th>Own part</th><th>Split</th><th>1 month: total = market + industry + own</th></tr></thead>`;
  AFTER.push(()=>{const i=$("#bq"); if(i){ i.value=state.bq||""; i.oninput=()=>{state.bq=i.value; render();}; i.focus(); i.setSelectionRange(i.value.length,i.value.length);} });
  return `<div><h2>Move breakdown: market, industry or the stock itself?</h2><p class="lede">Each stock's move split into three parts: the whole market's move (Nifty 500), its industry's extra move, and what is left: the stock's <b>own</b> part. A stock rising only because its industry rose is different from one rising on its own story.</p></div>
  <div class="card"><label>Find a stock: <input id="bq" placeholder="e.g. KOTAKBANK" style="padding:6px 8px"></label>${hit.length?`<div class="tablebox"><table>${head}<tbody>${hit.map(row).join("")}</tbody></table></div>`:q?'<p class="note">No match.</p>':""}</div>
  <div class="chips"><span class="chip"><i style="display:inline-block;width:10px;height:10px;background:#7d8590;margin-right:6px"></i>market</span><span class="chip"><i style="display:inline-block;width:10px;height:10px;background:#0969da;margin-right:6px"></i>industry</span><span class="chip"><i style="display:inline-block;width:10px;height:10px;background:var(--up);margin-right:6px"></i>own</span></div>
  <h3>Strongest on their own (last 3 months)</h3><div class="tablebox"><table>${head}<tbody>${own.slice(0,30).map(row).join("")}</tbody></table></div>

/* ---------------- deep data (loaded on demand) ---------------- */
const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
const crc32=s=>{let c=0xFFFFFFFF;for(const b of new TextEncoder().encode(s))c=CRC[(c^b)&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
const cache={};
const load=f=>cache[f]||(cache[f]=fetch("data/deep/"+f).then(r=>{if(!r.ok)throw new Error(f);return r.json();}));
const shardOf=s=>`stocks_${String(crc32(s)%48).padStart(2,"0")}.json`;
const gName=g=>g.replace(/^index: /,"").replace(/^industry: /,"Industry · ");
const gLink=g=>{const i=D.groups.findIndex(x=>x.g===g);return i<0?esc(gName(g)):`<a href="#g-${i}">${esc(gName(g))}</a>`;};
const sLink=s=>{const i=D.stocks.findIndex(x=>x.s===s);return i<0?esc(s):`<a href="#s-${i}">${esc(s)}</a>`;};
const PHC={Leading:"var(--up)",Weakening:"var(--warn)",Lagging:"var(--down)",Improving:"var(--accent)"};
const fmtPct=x=>x==null?"–":(x>0?"+":"")+(x*100).toFixed(0)+"%";

function bigChart(d,series,{h=240,marks=[],band=null}={}){ // series:[{v,color,dash,label}] values as ratios (1 = start)
  const W=900,P={l:46,r:12,t:12,b:band?40:24}, iw=W-P.l-P.r, ih=h-P.t-P.b, n=d.length;
  const all=series.flatMap(s=>s.v||[]).filter(x=>x!=null&&x>0); if(!all.length) return "";
  const lmn=Math.log(Math.min(...all)), lmx=Math.log(Math.max(...all)); const sy=y=>P.t+ih-(Math.log(y)-lmn)/(lmx-lmn||1)*ih, sx=i=>P.l+i*iw/Math.max(1,n-1);
  let o=`<svg viewBox="0 0 ${W} ${h}" width="100%" role="img">`;
  for(let k=0;k<=4;k++){const y=Math.exp(lmn+(lmx-lmn)*k/4);o+=`<line x1="${P.l}" x2="${W-P.r}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--soft)"/><text x="${P.l-6}" y="${sy(y)+3}" text-anchor="end">${y>=10?Math.round(y)+"×":((y-1)*100).toFixed(0)+"%"}</text>`;}
  let lastY=""; d.forEach((x,i)=>{const y=x.slice(0,4); if(y!==lastY&&(i===0||x.slice(5,7)==="01"||i===0)){ if(i>0||true){o+=`<line x1="${sx(i)}" x2="${sx(i)}" y1="${P.t}" y2="${P.t+ih}" stroke="var(--soft)"/><text x="${sx(i)+2}" y="${P.t+ih+12}">${y}</text>`;} lastY=y;}});
  series.forEach(s=>{ if(!s.v) return; let p=""; s.v.forEach((y,i)=>{ if(y!=null&&y>0) p+=(p?"L":"M")+sx(i).toFixed(1)+","+sy(y).toFixed(1); else if(p&&!p.endsWith(" ")) p+=" ";});
    p=p.replace(/ (?=M|$)/g,"").replace(/ L/g," M"); o+=`<path d="${p}" fill="none" stroke="${s.color}" stroke-width="${s.w||1.7}" ${s.dash?`stroke-dasharray="${s.dash}"`:""}/>`;});
  if(band){ const y0=P.t+ih+18; band.forEach((ph,i)=>{ if(ph) o+=`<rect x="${sx(i)}" y="${y0}" width="${iw/n+0.5}" height="10" fill="${PHC[ph]}" opacity=".8"/>`;});}
  const idxOf=dt=>{let lo=0,hi=n-1;while(lo<hi){const m=(lo+hi)>>1;if(d[m]<dt)lo=m+1;else hi=m;}return lo;};
  marks.forEach(m=>{const i=idxOf(m.d); const base=series[0].v[i]; if(base==null) return; o+=`<circle cx="${sx(i)}" cy="${sy(base)}" r="3.2" fill="${m.c}" stroke="var(--panel)" stroke-width="1"><title>${esc(m.d+" · "+m.t)}</title></circle>`;});
  return o+"</svg>";}
function legend(items){return `<div class="chips">${items.map(([c,l,dash])=>`<span class="note" style="display:inline-flex;align-items:center;gap:6px"><svg width="22" height="8"><line x1="0" x2="22" y1="4" y2="4" stroke="${c}" stroke-width="2" ${dash?`stroke-dasharray="${dash}"`:""}/></svg>${l}</span>`).join("")}</div>`;}
function bars(items,{fmt=fmtPct,h=150,sub=null}={}){ // items:[{l,v,s}] diverging bars around 0
  const W=640,P={l:8,r:8,t:16,b:34},n=items.length,iw=W-P.l-P.r,ih=h-P.t-P.b; const vals=items.map(x=>x.v).filter(x=>x!=null);
  const mx=Math.max(0.0001,...vals.map(Math.abs)); const sy=v=>P.t+ih/2-(v/mx)*(ih/2), bw=iw/n*0.66;
  let o=`<svg viewBox="0 0 ${W} ${h}" width="100%" role="img"><line x1="${P.l}" x2="${W-P.r}" y1="${sy(0)}" y2="${sy(0)}" stroke="var(--line)"/>`;
  items.forEach((x,i)=>{const cx=P.l+(i+.5)*iw/n; if(x.v!=null){const y=sy(x.v); o+=`<rect x="${cx-bw/2}" y="${Math.min(y,sy(0))}" width="${bw}" height="${Math.max(1,Math.abs(y-sy(0)))}" fill="${x.v>=0?"var(--up)":"var(--down)"}" opacity=".8"><title>${esc(x.l)}: ${fmt(x.v)}</title></rect><text x="${cx}" y="${x.v>=0?y-3:y+11}" text-anchor="middle">${fmt(x.v)}</text>`;}
    o+=`<text x="${cx}" y="${h-18}" text-anchor="middle">${esc(x.l)}</text>${x.s!=null?`<text x="${cx}" y="${h-5}" text-anchor="middle">${esc(x.s)}</text>`:""}`;});
  return o+"</svg>";}
function rangeRow(label,r,{fmt=fmtPct,lim=null}={}){ if(!r) return `<div class="rg"><span>${label}</span><span class="note">too few past cases</span></div>`;
  const L=lim||Math.max(Math.abs(r.p10),Math.abs(r.p90),0.05), x=v=>50+v/L*50;
  return `<div class="rg"><span>${label}</span><div class="rgbar" title="10%: ${fmt(r.p10)} · 25%: ${fmt(r.p25)} · median ${fmt(r.p50)} · 75%: ${fmt(r.p75)} · 90%: ${fmt(r.p90)}">
   <i style="left:50%;width:1px;top:0;bottom:0;background:var(--muted)"></i>
   <i style="left:${x(r.p10)}%;width:${x(r.p90)-x(r.p10)}%;top:45%;height:10%;background:var(--muted);opacity:.5"></i>
   <i style="left:${x(r.p25)}%;width:${x(r.p75)-x(r.p25)}%;top:25%;height:50%;background:var(--accent);opacity:.55;border-radius:3px"></i>
   <i style="left:${x(r.p50)}%;width:3px;top:10%;height:80%;background:var(--ink)"></i></div>
   <span class="note">median <b>${fmt(r.p50)}</b> · middle half ${fmt(r.p25)} to ${fmt(r.p75)} · 1 in 10 above ${fmt(r.p90)}, 1 in 10 below ${fmt(r.p10)} · up/ahead in ${pct(r.pos)} · ${r.n.toLocaleString()} cases</span></div>`;}
function phaseBar(m){ if(!m) return '<span class="note">not enough history</span>'; const ord=["Leading","Weakening","Lagging","Improving"];
  return `<div style="display:flex;height:22px;border-radius:6px;overflow:hidden">${ord.map(k=>m[k]?`<div title="${k} ${pct(m[k])}" style="width:${m[k]*100}%;background:${PHC[k]};color:var(--panel);font-size:11px;display:flex;align-items:center;justify-content:center;overflow:hidden">${m[k]>0.12?k[0]+" "+pct(m[k]):""}</div>`:"").join("")}</div>`;}

const short=g=>gName(g).replace(/^NIFTY ?/,"").replace("Industry · ","").slice(0,18);
function rrg(rows){ const W=720,H=520,P=36; const xs=rows.flatMap(r=>r.tail.map(t=>t[0])).filter(Number.isFinite), ys=rows.flatMap(r=>r.tail.map(t=>t[1])).filter(Number.isFinite);
  const mx=Math.max(1.5,...xs.map(Math.abs))*1.08, my=Math.max(1.5,...ys.map(Math.abs))*1.08;
  const sx=x=>P+(x+mx)/(2*mx)*(W-2*P), sy=y=>H-P-(y+my)/(2*my)*(H-2*P), cx=sx(0), cy=sy(0);
  let o=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Rotation map">
   <rect x="${cx}" y="${P}" width="${W-P-cx}" height="${cy-P}" fill="var(--up-soft)"/><rect x="${cx}" y="${cy}" width="${W-P-cx}" height="${H-P-cy}" fill="var(--warn-soft)"/>
   <rect x="${P}" y="${cy}" width="${cx-P}" height="${H-P-cy}" fill="var(--down-soft)"/><rect x="${P}" y="${P}" width="${cx-P}" height="${cy-P}" fill="var(--accent-soft)"/>
   <line x1="${P}" x2="${W-P}" y1="${cy}" y2="${cy}" stroke="var(--line)"/><line x1="${cx}" x2="${cx}" y1="${P}" y2="${H-P}" stroke="var(--line)"/>
   <text x="${W-P-4}" y="${P+14}" text-anchor="end" style="font-size:12px;fill:var(--up)">LEADING</text><text x="${W-P-4}" y="${H-P-6}" text-anchor="end" style="font-size:12px;fill:var(--warn)">WEAKENING</text>
   <text x="${P+4}" y="${H-P-6}" style="font-size:12px;fill:var(--down)">LAGGING</text><text x="${P+4}" y="${P+14}" style="font-size:12px;fill:var(--accent)">IMPROVING</text>
   <text x="${W/2}" y="${H-8}" text-anchor="middle">← weaker than its usual vs market · stronger →</text>
   <text x="12" y="${H/2}" transform="rotate(-90 12 ${H/2})" text-anchor="middle">← losing momentum · gaining →</text>`;
  rows.forEach(r=>{ const t=r.tail.filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1])); if(t.length<2) return; const c=PHC[r.phase]||"var(--muted)"; const i=D.groups.findIndex(x=>x.g===r.g);
    o+=`<a href="#g-${i}"><polyline points="${t.map(p=>sx(p[0]).toFixed(1)+","+sy(p[1]).toFixed(1)).join(" ")}" fill="none" stroke="${c}" stroke-width="1.4" opacity=".55"/>`;
    t.slice(0,-1).forEach(p=>o+=`<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="1.8" fill="${c}" opacity=".5"/>`);
    const e=t[t.length-1]; o+=`<circle cx="${sx(e[0])}" cy="${sy(e[1])}" r="5" fill="${c}" stroke="var(--panel)" stroke-width="1.5"><title>${esc(gName(r.g))}: ${r.phase}</title></circle>
      <text x="${sx(e[0])+7}" y="${sy(e[1])+3}" style="fill:var(--ink);font-family:var(--body);font-size:10.5px">${esc(short(r.g))}</text></a>`;});
  return o+"</svg>";}
async function viewRotation(){ const Wd=await load("watch.json"); const R=Wd.rotation; const cat=state.rcat||"Sectors";

   <p class="note">The warnings are right more often than chance, but less than half the time. Treat them as "watch this", not as a call.</p></section>`;}

function heatCol(v,sc){ if(v==null||!isFinite(v)) return "var(--soft)"; const a=Math.min(1,Math.abs(v)/sc); const pc=Math.round(12+a*78);
  return `color-mix(in srgb, ${v>=0?"var(--up)":"var(--down)"} ${pc}%, var(--panel))`;}
const heatInk=(v,sc)=>v!=null&&Math.abs(v)/sc>0.55?"#fff":"var(--ink)";
function squarify(items,x,y,w,h){ // items: [{size,...}] -> [{...,x,y,w,h}]
  const out=[]; let rest=items.filter(i=>i.size>0).sort((a,b)=>b.size-a.size); const total=rest.reduce((s,i)=>s+i.size,0); if(!total) return out;
  const scale=w*h/total; rest=rest.map(i=>({...i,a:i.size*scale}));
  const worst=(row,side)=>{const s=row.reduce((t,r)=>t+r.a,0),mx=Math.max(...row.map(r=>r.a)),mn=Math.min(...row.map(r=>r.a));return Math.max(side*side*mx/(s*s),(s*s)/(side*side*mn));};
  while(rest.length){ const side=Math.min(w,h); let row=[rest[0]],i=1;
    while(i<rest.length&&worst([...row,rest[i]],side)<=worst(row,side)){row.push(rest[i]);i++;}
    const s=row.reduce((t,r)=>t+r.a,0);
    if(w>=h){ const cw=s/h; let cy=y; row.forEach(r=>{const rh=r.a/cw; out.push({...r,x,y:cy,w:cw,h:rh}); cy+=rh;}); x+=cw; w-=cw; }
    else { const ch=s/w; let cx=x; row.forEach(r=>{const rw=r.a/ch; out.push({...r,x:cx,y,w:rw,h:ch}); cx+=rw;}); y+=ch; h-=ch; }
    rest=rest.slice(i);}
  return out;}
function treemap(groups,per,{W=1000,H=600,link=s=>"#"}={}){ // groups: [{name, items:[{s,size,val,title}]}]
  const sc=SCALE[per]||0.1; const G=squarify(groups.map(g=>({...g,size:g.items.reduce((t,i)=>t+(i.size||0),0)})),0,0,W,H);
  let o=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Market map" style="display:block">`;
  G.forEach(g=>{ const pad=g.w>60&&g.h>40?14:0; const cells=squarify(g.items,g.x+1,g.y+pad+1,g.w-2,g.h-pad-2);
    cells.forEach(c=>{ const v=c.val; o+=`<a href="${link(c.s)}"><rect x="${c.x}" y="${c.y}" width="${Math.max(0,c.w-1)}" height="${Math.max(0,c.h-1)}" fill="${heatCol(v,sc)}"><title>${esc(c.title||c.s)}: ${sgn(v,1)}</title></rect>`;
      if(c.w>34&&c.h>18){ const fs=Math.max(8,Math.min(16,Math.sqrt(c.w*c.h)/6)); o+=`<text x="${c.x+c.w/2}" y="${c.y+c.h/2-(c.h>2.6*fs?fs*0.25:-fs*0.35)}" text-anchor="middle" style="fill:${heatInk(v,sc)};font-family:var(--body);font-size:${fs}px;font-weight:600">${esc(c.s.length>10&&c.w<70?c.s.slice(0,9):c.s)}</text>`;
        if(c.h>2.6*fs) o+=`<text x="${c.x+c.w/2}" y="${c.y+c.h/2+fs*0.95}" text-anchor="middle" style="fill:${heatInk(v,sc)};font-size:${fs*0.8}px">${sgn(v,1)}</text>`;}
      o+="</a>";});
    if(pad) o+=`<text x="${g.x+4}" y="${g.y+11}" style="fill:var(--ink);font-family:var(--body);font-size:10.5px;font-weight:600">${esc(g.name.length*6>g.w?g.name.slice(0,Math.max(3,Math.floor(g.w/6.3)))+"…":g.name)}</text>`;
    o+=`<rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" fill="none" stroke="var(--bg)" stroke-width="2"/>`;});
  return o+"</svg>";}

  const at=j=>{ svgs.forEach(o=>{ const W=160,sx=W/(o.v.length-1); o.line.setAttribute("x1",j*sx); o.line.setAttribute("x2",j*sx); const f=o.v.find(z=>z!=null); const c=o.v[j]!=null&&f?o.v[j]/f-1:null; o.val.textContent=sgn(c,1); o.val.className="mval "+cls(c);});

  const reset=()=>{ svgs.forEach(o=>{o.line.setAttribute("x1",-10);o.line.setAttribute("x2",-10);o.val.textContent=o.val.dataset.base;o.val.className="mval "+(o.val.dataset.base.startsWith("+")?"pos":o.val.dataset.base.startsWith("−")||o.val.dataset.base.startsWith("-")?"neg":"");}); if(lbl) lbl.textContent="Weekly closes. Move the pointer across any mini chart: every chart shows its change from the start of the period up to that week.";};
  g.addEventListener("pointermove",e=>{ const s=e.target.closest("svg.mini"); if(!s) return; const r=s.getBoundingClientRect(); const n=svgs[0].v.length; at(Math.max(0,Math.min(n-1,Math.round((e.clientX-r.left)/r.width*(n-1)))));});
  g.addEventListener("pointerleave",reset);}

const RSC={cat:"Sectors",per:"6M",bench:"index",per2:"6M",selI:null,selS:null,gi:null};
const PAL=["#2f7ed8","#e8743b","#19a979","#d63a6a","#8b5fcf","#13a4b4","#c79a00","#5a9e2f","#b5523b","#6c7f8c"];
const PDAYS={"1M":21,"3M":63,"6M":126,"1Y":250,"2Y":499}, PWEEKS={"3M":13,"6M":26,"1Y":52,"2Y":100};
function rsSeries(px,bx){ // ratio normalised to 0% at the first point where both exist
  let f=-1; for(let i=0;i<px.length;i++){ if(px[i]!=null&&bx[i]!=null){f=i;break;} } if(f<0) return px.map(()=>null);
  const b=px[f]/bx[f]; return px.map((p,i)=>p!=null&&bx[i]!=null?(p/bx[i])/b-1:null);}
function miniRS(a,id,col){ const v=a.filter(x=>x!=null); if(v.length<2) return '<div class="note">no data</div>';

  a.forEach((y,i)=>{if(y!=null)p+=(p?"L":"M")+(i*sx).toFixed(1)+","+sy(y).toFixed(1);});
  const last=v[v.length-1], c=col||(last>=0?"var(--up)":"var(--down)");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" class="mini rsmini" data-vals="${a.map(x=>x==null?"":x.toFixed(4)).join(",")}"><line x1="0" x2="${W}" y1="${sy(0)}" y2="${sy(0)}" stroke="var(--line)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/><path d="${p}" fill="none" stroke="${c}" stroke-width="1.6" vector-effect="non-scaling-stroke"/><line class="hv" x1="-10" x2="-10" y1="0" y2="${H}" stroke="var(--ink)" vector-effect="non-scaling-stroke" opacity=".5"/></svg>`;}

  if(!svgs.length) return; const n=svgs[0].v.length;
  const at=j=>{ svgs.forEach(o=>{const sx=160/(o.v.length-1); o.line.setAttribute("x1",j*sx); o.line.setAttribute("x2",j*sx); const c=o.v[j]; o.val.textContent=sgn(c,1); o.val.className="mval "+cls(c);}); if(lbl) lbl.innerHTML=`<b>${ds[j]}</b>: relative strength since ${ds[0]}. Move off the charts to see the latest.`;};
  const reset=()=>{ svgs.forEach(o=>{o.line.setAttribute("x1",-10);o.line.setAttribute("x2",-10);o.val.textContent=o.val.dataset.base;o.val.className="mval "+(o.val.dataset.base.startsWith("+")?"pos":o.val.dataset.base.startsWith("-")?"neg":"");}); if(lbl) lbl.textContent=base;};

  let acc=new Array(n).fill(0), o=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  ser.forEach((v,k)=>{ const top=v.map((x,i)=>acc[i]+(x||0)); let pth=""; top.forEach((y,i)=>pth+=(i?"L":"M")+sx(i).toFixed(1)+","+sy(y).toFixed(1)); for(let i=n-1;i>=0;i--) pth+="L"+sx(i).toFixed(1)+","+sy(acc[i]).toFixed(1);

function miniRatio(vals){ const v=vals.filter(x=>x!=null); if(v.length<2) return '<div class="note">no data</div>';

  v.querySelectorAll("[data-cht]").forEach(el=>el.onchange=()=>{CH[el.dataset.cht]=el.checked;render();});
  v.querySelectorAll("[data-chnav]").forEach(el=>el.onclick=()=>{const m=(location.hash.match(/^#ch-(\d+)/)||[])[1]; const gi=m??($("#chIdx")||{}).value; if(el.dataset.chnav==="0") location.hash="ch-"+gi; else if(el.dataset.to!=null) location.hash="ch-"+gi+"-"+el.dataset.to;});
  v.querySelectorAll("[data-chrow]").forEach(el=>el.onclick=()=>{const gi=(location.hash.match(/^#ch-(\d+)/)||[])[1]??($("#chIdx")||{}).value; location.hash="ch-"+gi+"-"+el.dataset.chrow;});
  const chS=$("#chSort"); if(chS) chS.onchange=()=>{CH.sort=chS.value;render();};
  v.querySelectorAll("[data-jump]").forEach(el=>el.onclick=()=>{const t=document.getElementById(el.dataset.jump); if(t) window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-150,behavior:"smooth"});});
  v.querySelectorAll("[data-mper]").forEach(el=>el.onclick=()=>{state.mper=el.dataset.mper;render();});
  v.querySelectorAll("[data-cper]").forEach(el=>el.onclick=()=>{state.cper=el.dataset.cper;render();});
  v.querySelectorAll("[data-iview]").forEach(el=>el.onclick=()=>{state.iview=el.dataset.iview;render();});
  v.querySelectorAll("[data-iper]").forEach(el=>el.onclick=e=>{e.stopPropagation();state.iper=el.dataset.iper;render();});
  v.querySelectorAll("[data-icat]").forEach(el=>el.onclick=()=>{state.icat=el.dataset.icat;render();});
  v.querySelectorAll("th[data-isort]").forEach(th=>th.onclick=()=>{const k=th.dataset.isort; state.idir=state.isort===k?-(state.idir||1):(k==="name"?1:-1); state.isort=k; render();});
  v.querySelectorAll("th[data-csort]").forEach(th=>th.onclick=e=>{e.stopPropagation(); const k=th.dataset.csort; state.cdir=state.csort===k?-(state.cdir||-1):(["s","name","ind"].includes(k)?1:-1); state.csort=k; render();});
  v.querySelectorAll("[data-rscat]").forEach(el=>el.onclick=()=>{state.rscat=el.dataset.rscat;render();});
  v.querySelectorAll("th[data-rsk]").forEach(th=>th.onclick=()=>{const k=th.dataset.rsk; state.rsDir=state.rsSort===k?-(state.rsDir||-1):-1; state.rsSort=k; render();});
  const rsq=$("#rsq"); if(rsq) rsq.oninput=()=>{state.rsq=rsq.value;state.rsShown=150; const pos=rsq.selectionStart; render().then(()=>{const n=$("#rsq"); if(n){n.focus(); n.setSelectionRange(pos,pos);}});};
  const rsQuad=$("#rsQuad"); if(rsQuad) rsQuad.onchange=()=>{state.rsQuad=rsQuad.value;render();};
  const rsLiq=$("#rsLiq"); if(rsLiq) rsLiq.onchange=()=>{state.rsLiq=rsLiq.checked;render();};
  const rsMore=$("#rsMore"); if(rsMore) rsMore.onclick=()=>{state.rsShown=(state.rsShown||150)+300;render();};
  v.querySelectorAll("[data-rcat]").forEach(el=>el.onclick=()=>{state.rcat=el.dataset.rcat;render();});
  v.querySelectorAll("[data-cat]").forEach(el=>el.onclick=()=>{state.cat=el.dataset.cat;render();});
  const ind=$("#ind"); if(ind) ind.onchange=()=>{state.ind=ind.value;state.shown=150;render();};
  const liq=$("#liq"); if(liq) liq.onchange=()=>{state.liq=liq.checked;state.shown=150;render();};
  const more=$("#more"); if(more) more.onclick=()=>{state.shown+=300;render();};
  ["pu","ph","po","pd"].forEach(id=>{const el=$("#"+id); if(el) el.onchange=()=>{state[id]=el.value;render();};});
  const pq=$("#pq"); if(pq) pq.oninput=()=>{state.pq=pq.value; const pos=pq.selectionStart; render().then(()=>{const n=$("#pq"); if(n){n.focus(); n.setSelectionRange(pos,pos);}});};
}
window.addEventListener("hashchange",render);
Promise.all(["market","groups","stocks","patterns"].map(n=>fetch(`data/${n}.json`).then(r=>{ if(!r.ok) throw new Error(n); return r.json();})))
 .then(([market,groups,stocks,patterns])=>{ D={market,groups,stocks,patterns};
   $("#stamp").textContent=`Data to ${market.date} · ${stocks.length.toLocaleString()} stocks · ${groups.length} indices & industries · odds, not advice`;
   searchSetup(); render();})
 .catch(e=>{ $("#view").innerHTML=`<div class="empty">Could not load the data file "${esc(e.message)}". Reload the page to try again.</div>`;});
</script>
